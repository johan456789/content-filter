name: Build filter list

on:
  push:
    branches: [main]
    paths: ['filters/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build combined filter list
        run: |
          mkdir -p build

          # Extract header (lines before first !#include)
          sed -n '1,/!#include/{/!#include/!p}' filters/main.txt > build/main.txt

          # Parse !#include directives in order, append each file
          grep '^!#include' filters/main.txt | while read -r line; do
            file=$(echo "$line" | sed 's/^!#include *//')
            echo "" >> build/main.txt
            cat "filters/$file" >> build/main.txt
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          force_orphan: true
